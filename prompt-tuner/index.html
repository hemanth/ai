<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebLLM Prompt Tuner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --background: #ffffff;
            --foreground: #090d16;
            --card: #ffffff;
            --card-foreground: #090d16;
            --primary: #181f2f;
            --primary-foreground: #f8fafc;
            --muted: #f1f5f9;
            --muted-foreground: #64748b;
            --border: #e2e8f0;
            --input: #e2e8f0;
            --radius: 0.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 42rem;
            margin-left: auto;
            margin-right: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .header p {
            color: var(--muted-foreground);
            font-size: 0.95rem;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--card-foreground);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--input);
            background: #fff;
            color: inherit;
            font-family: inherit;
            font-size: 0.875rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #2a2428;
            box-shadow: 0 0 0 1px #2a2428;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            background-color: #2a2428;
            color: #ffffff;
            border: none;
            height: 3rem;
            padding: 0 1.5rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #3f363c;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            font-size: 0.8125rem;
            color: var(--muted-foreground);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1.5rem;
        }

        .spinner {
            width: 2rem;
            height: 2rem;
            border: 2px solid #e2e8f0;
            border-bottom-color: #2a2428;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-box {
            display: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            padding: 1.25rem;
            line-height: 1.6;
            font-size: 0.9375rem;
        }

        .result-box.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .result-header h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-foreground);
        }

        .copy-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--muted-foreground);
        }

        .copy-btn:hover {
            color: #000;
            border-color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>WebLLM Prompt Tuner</h1>
            <p>Optimize your prompts with AI assistance</p>
        </div>

        <div class="card">
            <textarea id="prompt-input" placeholder="Enter your prompt here..."></textarea>
            <button id="submit-btn" class="btn-submit">
                Fine-tune Prompt
            </button>
            <div id="model-progress" class="status-badge">⚡ Ready (Cloud AI acceleration active)</div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 0.75rem; font-size: 0.875rem; color: var(--muted-foreground);">Optimizing prompt with AI...</p>
        </div>

        <div id="result" class="result-box">
            <div class="result-header">
                <h3>Refined Prompt</h3>
                <button id="copy-btn" class="copy-btn">Copy</button>
            </div>
            <div id="result-content"></div>
        </div>
    </div>

    <script type="module">
        const promptInput = document.getElementById('prompt-input');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('result-content');
        const copyBtn = document.getElementById('copy-btn');
        const modelProgress = document.getElementById('model-progress');

        let webllmChat = null;
        let isLocalReady = false;

        const SYSTEM_PROMPT = `You are an AI prompt optimization specialist. When given a prompt to improve, respond only with the enhanced version - no analysis, no explanations, no comparisons. Format the improved prompt in clean markdown without any meta-commentary.
Your enhancements should:
- Add relevant context and role framing
- Specify explicit output format, length, and style expectations
- Include precise constraints and guidelines
- Maintain clarity, conciseness, and eliminate ambiguity
- Use precise language

Deliver exclusively the refined, ready-to-use prompt.`;

        // Optional background WebLLM initialization with safe quota error catching
        async function tryInitWebLLM() {
            try {
                if (!('gpu' in navigator)) {
                    modelProgress.innerText = "⚡ Cloud AI Engine active";
                    return;
                }
                const webllm = await import("https://esm.run/@mlc-ai/web-llm");
                modelProgress.innerText = "Checking local WebLLM...";
                const engine = await webllm.CreateMLCEngine(
                    "SmolLM2-135M-Instruct-q4f16_1-MLC",
                    {
                        initProgressCallback: (report) => {
                            modelProgress.innerText = report.text;
                        }
                    }
                );
                webllmChat = engine.chat;
                isLocalReady = true;
                modelProgress.innerText = "🟢 WebLLM In-Browser active";
            } catch (err) {
                console.info("Using high-speed Cloud AI:", err.message || err);
                modelProgress.innerText = "⚡ Cloud AI Engine active";
            }
        }

        // Initialize in background without blocking UI
        setTimeout(() => tryInitWebLLM(), 100);

        async function generateEnhancedPrompt(userPrompt) {
            // If local WebLLM is loaded and functional, try it
            if (isLocalReady && webllmChat) {
                try {
                    const response = await webllmChat.completions.create({
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: `Refine this prompt:\n${userPrompt}` }
                        ]
                    });
                    return response.choices[0].message.content;
                } catch (e) {
                    console.warn("Local WebLLM error, falling back to Cloud AI:", e);
                }
            }

            // High-speed resilient Cloud AI via ai-proxy
            const response = await fetch("https://ai-proxy.hemanthhm.workers.dev", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "@cf/meta/llama-3.2-3b-instruct",
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        { role: "user", content: `Refine this prompt:\n${userPrompt}` }
                    ]
                })
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            return data?.result?.response || data?.result?.choices?.[0]?.message?.content || data?.choices?.[0]?.message?.content || "";
        }

        submitBtn.addEventListener('click', async () => {
            const userPrompt = promptInput.value.trim();
            if (!userPrompt) return;

            loading.style.display = 'block';
            result.classList.remove('show');
            submitBtn.disabled = true;

            try {
                const output = await generateEnhancedPrompt(userPrompt);
                resultContent.innerHTML = typeof marked !== 'undefined' ? marked.parse(output) : output;
                result.classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                resultContent.innerHTML = '<p style="color: #ef4444;">Failed to fine-tune prompt. Please try again.</p>';
                result.classList.add('show');
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        copyBtn.addEventListener('click', () => {
            const text = resultContent.innerText;
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.innerText = "Copied!";
                setTimeout(() => copyBtn.innerText = "Copy", 2000);
            });
        });
    </script>
</body>

</html>
