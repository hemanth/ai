<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Summary - AI-Powered Book Insights</title>
    <meta name="description"
        content="Get AI-powered summaries of any book with key themes, characters, and author insights">
    <meta property="og:title" content="Book Summary - AI-Powered Book Insights">
    <meta property="og:description" content="Get comprehensive AI summaries of any book">
    <meta property="og:url" content="https://h3manth.com/ai/book-summary/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --accent: #f59e0b;
            --accent-light: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            background: var(--accent);
            top: -20%;
            right: -10%;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-5%, 5%);
            }
        }

        header {
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .search-section {
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            padding: 12px 16px;
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-left: 8px;
        }

        .example-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .example-chip:hover {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--accent-light);
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            min-height: 200px;
        }

        .result-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-light);
        }

        .result-content {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .result-content.placeholder {
            font-style: italic;
            opacity: 0.6;
            text-align: center;
            padding: 40px 0;
        }

        .result-content h1,
        .result-content h2,
        .result-content h3 {
            color: var(--text-primary);
            margin: 20px 0 10px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .result-content h1:first-child,
        .result-content h2:first-child {
            margin-top: 0;
        }

        .result-content p {
            margin-bottom: 12px;
        }

        .result-content ul,
        .result-content ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }

        .result-content li {
            margin-bottom: 6px;
        }

        .result-content strong {
            color: var(--accent-light);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--accent-light);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <header>
        <h1>📚 Book Summary</h1>
        <p class="subtitle">AI-Powered Book Insights</p>
    </header>

    <main>
        <div class="search-section">
            <div class="input-group">
                <input type="text" id="book-input" placeholder="Enter a book title..." autocomplete="off">
                <button id="generate-btn">Get Summary</button>
            </div>
            <div class="examples">
                <span class="example-chip" onclick="tryBook('Atomic Habits')">Atomic Habits</span>
                <span class="example-chip" onclick="tryBook('1984')">1984</span>
                <span class="example-chip" onclick="tryBook('The Alchemist')">The Alchemist</span>
                <span class="example-chip" onclick="tryBook('Sapiens')">Sapiens</span>
                <span class="example-chip" onclick="tryBook('Deep Work')">Deep Work</span>
            </div>
        </div>

        <div class="result-card">
            <div class="result-content placeholder" id="result">
                Enter a book title above to get an AI-powered summary with key themes, characters, and insights.
            </div>
        </div>
    </main>

    <footer>
        Built with ❤️ by <a href="https://h3manth.com">Hemanth HM</a>
    </footer>

    <script>
        const bookInput = document.getElementById('book-input');
        const generateBtn = document.getElementById('generate-btn');
        const resultEl = document.getElementById('result');

        bookInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') generateSummary();
        });

        generateBtn.addEventListener('click', generateSummary);

        function tryBook(title) {
            bookInput.value = title;
            generateSummary();
        }

        async function generateSummary() {
            const bookTitle = bookInput.value.trim();
            if (!bookTitle) return;

            resultEl.classList.remove('placeholder');
            resultEl.innerHTML = '<div class="spinner"></div>';
            generateBtn.disabled = true;

            const prompt = `Summarize the book "${bookTitle}" in a clear and comprehensive way.

Include the following sections:

## Overview
A brief 2-3 sentence overview of what the book is about.

## Key Themes
The main themes and ideas explored in the book.

## Main Characters (if fiction) or Key Concepts (if non-fiction)
Brief descriptions of important characters or concepts.

## Author's Message
What the author is trying to convey to readers.

## Key Takeaways
3-5 practical insights or lessons from the book.

Please provide a thoughtful, neutral summary without spoilers for fiction. Format the response in markdown.`;

            try {
                const response = await fetch("https://ai-proxy.hemanthhm.workers.dev", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "@cf/meta/llama-3.2-3b-instruct",
                        messages: [
                            { role: "user", content: prompt }
                        ]
                    })
                });

                const data = await response.json();
                const content = data?.result?.response || data?.result?.choices?.[0]?.message?.content || data?.choices?.[0]?.message?.content || "No summary available.";
                resultEl.innerHTML = marked.parse(content);
            } catch (error) {
                console.error('Error:', error);
                resultEl.innerHTML = '<p style="color: #ef4444;">Error generating summary. Please try again.</p>';
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
