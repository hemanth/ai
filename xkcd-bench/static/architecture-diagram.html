<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XKCD-Bench Evaluation &amp; Retrieval Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff;
      --paper-2: #fafafa;
      --ink: #000000;
      --muted: #555555;
      --soft: #777777;
      --rule: rgba(0, 0, 0, 0.12);
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      padding: 32px;
      max-width: 1160px;
      margin: 0 auto;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .diagram-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      padding: 16px;
      margin-bottom: 24px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.85fr;
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--ink);
      border-radius: 8px;
      padding: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
    }
    .card h3 {
      font-size: 16px;
      font-weight: 600;
    }
    .card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    @keyframes march-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -16; }
    }
    .flow-dashed {
      stroke-dasharray: 4, 4;
      animation: march-flow 1.6s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-dashed { animation: none; }
    }
  </style>
</head>
<body>
  <p class="eyebrow">SYSTEMS ARCHITECTURE BLUEPRINT · XKCD-BENCH V1</p>
