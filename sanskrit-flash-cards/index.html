<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard App</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    #card-container {
      max-width: 400px;
      width: 85%;
      perspective: 1000px;
    }

    #card {
      position: relative;
      width: 100%;
      height: 300px;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    #front, #back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      box-sizing: border-box;
      cursor: pointer;
    }

    #back {
      transform: rotateY(180deg);
    }

    #nav-buttons {
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 0 10px;
    }
  </style>
</head>

    function showCard() {
      const cardFront = card.querySelector('#front');
      const cardBack = card.querySelector('#back');

      cardFront.querySelector('p').textContent = flashcards[currentCardIndex].question;
      cardBack.querySelector('p').textContent = flashcards[currentCardIndex].answer;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      card.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
    }

    function previousCard() {
      isFlipped = false;
      currentCardIndex = (currentCardIndex - 1 + flashcards.length) % flashcards.length;
      showCard();
      card.style.transform = 'rotateY(0deg)';
    }

    function nextCard() {
      isFlipped = false;
      currentCardIndex = (currentCardIndex + 1) % flashcards.length;
      showCard();
      card.style.transform = 'rotateY(0deg)';
    }

    card.addEventListener('click', flipCard);
    prevBtn.addEventListener('click', previousCard);
    nextBtn.addEventListener('click', nextCard);

    showCard();
