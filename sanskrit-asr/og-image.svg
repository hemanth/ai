<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a1708" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#09090c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Logo Icon -->
  <g transform="translate(80, 110)">
    <rect width="64" height="64" rx="14" fill="#141419" stroke="#2b2b36" stroke-width="1.5"/>
    <g fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round">
      <path d="M14 32h4"/>
      <path d="M22 24v16"/>
      <path d="M30 15v34"/>
      <path d="M38 21v22"/>
      <path d="M46 27v10"/>
      <path d="M52 32h-2"/>
    </g>
  </g>

  <!-- Site Badge -->
  <g transform="translate(160, 126)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#a1a1aa" letter-spacing="1">H3MANTH.COM / AI / SANSKRIT-ASR</text>
  </g>

  <!-- Title & Devanagari -->
  <g transform="translate(80, 260)">
    <text font-family="'Noto Serif Devanagari', 'Georgia', serif" font-size="74" font-weight="700" fill="#f4f4f6" letter-spacing="-0.5">सुश्रोता <tspan fill="#f59e0b" font-weight="400">·</tspan> <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Su-śrotā</tspan></text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 335)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" fill="#d4d4d8">In-Browser Sanskrit Speech Recognition</text>
  </g>

  <!-- Description -->
  <g transform="translate(80, 395)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#888894" line-height="1.5">
      100% client-side IndicConformer-CTC ASR running locally via ONNX WebAssembly.
    </text>
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#888894">
      Instant offline transcription, Devānagarī + IAST transliteration, and live mic input.
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(80, 485)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#15151c" stroke="#2c2c38" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="5" fill="#22c55e"/>
    <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e4e4e7">100% Private</text>

    <!-- Badge 2 -->
    <rect x="185" y="0" width="180" height="42" rx="21" fill="#15151c" stroke="#2c2c38" stroke-width="1.2"/>
    <text x="20" y="27" transform="translate(185, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#f59e0b">⚡ Conformer-CTC</text>

    <!-- Badge 3 -->
    <rect x="380" y="0" width="175" height="42" rx="21" fill="#15151c" stroke="#2c2c38" stroke-width="1.2"/>
    <text x="20" y="27" transform="translate(380, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e4e4e7">WASM SIMD 4T</text>

    <!-- Badge 4 -->
    <rect x="570" y="0" width="165" height="42" rx="21" fill="#15151c" stroke="#2c2c38" stroke-width="1.2"/>
    <text x="20" y="27" transform="translate(570, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e4e4e7">Zero Cloud Server</text>
  </g>
</svg>
