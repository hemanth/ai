<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome AI Text Summarizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #e8e8e8;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            font-size: 15px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: #0a0a0a;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
            border: 1px solid #1a1a1a;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        textarea,
        select,
        button {
            width: 100%;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        textarea,
        select {
            background-color: #0a0a0a;
            color: #e8e8e8;
            border: 1px solid #1a1a1a;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        textarea:focus,
        select:focus {
            outline: none;
            border-color: #444;
            box-shadow: 0 0 0 2px rgba(68, 68, 68, 0.2);
        }

        textarea::placeholder {
            color: #555;
        }

        textarea {
            flex: 1;
            min-height: 150px;
            resize: none;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23666' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        button {
            background-color: #222;
            color: #e8e8e8;
            border: 1px solid #1a1a1a;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background-color: #333;
            border-color: #444;
        }

        button:disabled {
            background-color: #111;
            color: #555;
            cursor: not-allowed;
        }

        .output-container {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .output {
            padding: 1rem;
            background-color: #111;
            border-radius: 8px;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            border: 1px solid #1a1a1a;
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
        }

        .output-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #888;
        }

        .select-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        @media (max-width: 640px) {
            .select-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="dark">
    <div class="container" id="app">
        <div class="card">
            <h1>Chrome AI Summarizer</h1>
            <textarea id="inputText" placeholder="Paste your text here to summarize..."
                aria-label="Input text"></textarea>

            <div class="select-group">
                <select id="type" aria-label="Summary type">
                    <option value="key-points" selected>Key Points</option>
                    <option value="teaser">Teaser</option>
                    <option value="headline">Headline</option>
                </select>
                <select id="length" aria-label="Length">
                    <option value="short">Short</option>
                    <option value="medium" selected>Medium</option>
                    <option value="long">Long</option>
                </select>
                <select id="format" aria-label="Format">
                    <option value="markdown" selected>Markdown</option>
                    <option value="plain-text">Plain Text</option>
                </select>
            </div>

            <button id="summarizeButton">Summarize Text</button>

            <div class="output-container">
                <div class="output-header">
                    <span>✨ Summary Result:</span>
                </div>
                <div class="output" id="outputText">Summary will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const type = document.getElementById('type');
        const length = document.getElementById('length');
        const format = document.getElementById('format');
        const summarizeButton = document.getElementById('summarizeButton');
        const outputText = document.getElementById('outputText');

        async function checkAvailability() {
            if (typeof Summarizer === 'undefined') {
                return 'unavailable';
            }
            try {
                return await Summarizer.availability({ expectedOutputs: [{ type: 'text', languages: ['en'] }] });
            } catch (e) {
                console.error("Availability check failed:", e);
                return 'unavailable';
            }
        }

        async function summarizeText(text, type, length, format) {
            const summarizer = await Summarizer.create({ type, length, format, expectedOutputs: [{ type: 'text', languages: ['en'] }] });
            return summarizer.summarize(text);
        }

        summarizeButton.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) return;

            summarizeButton.disabled = true;
            summarizeButton.textContent = 'Summarizing...';
            outputText.textContent = 'Processing...';

            try {
                const availability = await checkAvailability();
                if (availability === 'unavailable') {
                    throw new Error('Summarizer API not available.');
                }

                const result = await summarizeText(text, type.value, length.value, format.value);
                outputText.textContent = result;
            } catch (error) {
                console.error('Error summarizing text:', error);
                outputText.textContent = `Error: ${error.message}\n\nEnsure the Summarizer API is enabled in chrome://flags.`;
            } finally {
                summarizeButton.disabled = false;
                summarizeButton.textContent = 'Summarize Text';
            }
        });

        inputText.addEventListener('input', () => {
            summarizeButton.disabled = !inputText.value.trim();
        });

        // Initial availability check
        checkAvailability().then(status => {
            if (status === 'unavailable') {
                outputText.textContent = 'Status: Summarizer API not available. Enable Summarizer API in chrome://flags.';
                summarizeButton.disabled = true;
            } else if (status === 'downloadable') {
                outputText.textContent = 'Summarizer model will download on first use.';
            } else {
                outputText.textContent = 'Ready to summarize!';
            }
        });
    </script>
</body>

</html>
