<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Translate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #e8e8e8;
            background-color: #050505;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: #050505;
            border-radius: 8px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            border: 1px solid #1a1a1a;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: #e8e8e8;
            letter-spacing: -0.02em;
        }

        textarea,
        select,
        button {
            width: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        textarea,
        select {
            background-color: #0a0a0a;
            color: #e8e8e8;
            border: 1px solid #1a1a1a;
            padding: 0.85rem;
            margin-bottom: 1.25rem;
        }

        textarea:focus,
        select:focus {
            outline: none;
            border-color: #444;
        }

        textarea::placeholder {
            color: #888;
        }

        textarea {
            flex: 1;
            min-height: 120px;
            resize: none;
        }

        select option {
            background-color: #0a0a0a;
            color: #e8e8e8;
        }

        .lang-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            background-color: #111;
            color: #888;
            border: 1px solid #1a1a1a;
            padding: 0.85rem 1rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            color: #fff;
            border-color: #333;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .output-label {
            font-weight: 500;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 0.01em;
        }

        .output {
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 1.25rem;
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #aaa;
            font-size: 15px;
            line-height: 1.7;
        }

        @media (max-width: 640px) {
            .lang-selectors {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Chrome AI Translator</h1>
            <textarea id="inputText" placeholder="Enter text to translate..." aria-label="Input text"></textarea>

            <div class="lang-selectors">
                <select id="sourceLanguage" aria-label="Source Language">
                    <option value="en" selected>English</option>
                    <option value="es">Spanish</option>
                    <option value="ja">Japanese</option>
                    <option value="zh">Chinese</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
                <select id="targetLanguage" aria-label="Target Language">
                    <option value="es" selected>Spanish</option>
                    <option value="en">English</option>
                    <option value="ja">Japanese</option>
                    <option value="zh">Chinese</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>

            <button id="translateButton">Translate Text</button>

            <div class="output-box">
                <div class="output-label">✨ Translation Result:</div>
                <div class="output" id="outputText">Translated text will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const sourceLanguage = document.getElementById('sourceLanguage');
        const targetLanguage = document.getElementById('targetLanguage');
        const translateButton = document.getElementById('translateButton');
        const outputText = document.getElementById('outputText');

        async function checkAvailability(srcLang, tgtLang) {
            if (typeof Translator === 'undefined') {
                return 'unavailable';
            }
            try {
                const result = await Translator.availability({ sourceLanguage: srcLang, targetLanguage: tgtLang });
                return result; // 'available', 'downloadable', or 'no-support'
            } catch (e) {
                console.error('Availability check error:', e);
                return 'unavailable';
            }
        }

        async function TranslateText(text, srcLang, tgtLang) {
            const availability = await checkAvailability(srcLang, tgtLang);
            if (availability === 'no-support' || availability === 'unavailable') {
                throw new Error(`Translation not available for ${srcLang} → ${tgtLang}.`);
            }
            const translator = await Translator.create({
                sourceLanguage: srcLang,
                targetLanguage: tgtLang
            });
            return translator.translate(text);
        }

        translateButton.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) return;

            translateButton.disabled = true;
            translateButton.textContent = 'Translating...';
            outputText.textContent = 'Processing...';

            try {
                const result = await TranslateText(text, sourceLanguage.value, targetLanguage.value);
                outputText.textContent = result;
            } catch (error) {
                console.error('Error translating text:', error);
                outputText.textContent = `Error: ${error.message}\n\nEnsure the Translator API is enabled in chrome://flags.`;
            } finally {
                translateButton.disabled = false;
                translateButton.textContent = 'Translate Text';
            }
        });

        inputText.addEventListener('input', () => {
            translateButton.disabled = !inputText.value.trim();
        });

        // Availability check on load with default language pair
        checkAvailability(sourceLanguage.value, targetLanguage.value).then(status => {
            if (status === 'no-support' || status === 'unavailable') {
                outputText.textContent = 'Status: Translator API not available. Enable Translator API in chrome://flags.';
                translateButton.disabled = true;
            } else if (status === 'downloadable') {
                outputText.textContent = 'Language model will download on first translation.';
            } else {
                outputText.textContent = 'Ready to translate!';
            }
        });
    </script>
</body>

</html>
