<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hairstyle - AI Hairstyle Suggester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            text-align: center;
        }

        .demo-embed {
            margin-bottom: 3rem;
            border: 1px solid #e0e0e0;
            padding: 1rem;
        }

        .upload-zone {
            border: 2px dashed #000;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .upload-zone.dragover {
            background: #f5f5f5;
        }

        .upload-zone p {
            font-size: 0.875rem;
            letter-spacing: 0.02em;
        }

        .upload-zone input {
            display: none;
        }

        .preview {
            margin-top: 2rem;
            border: 1px solid #000;
            padding: 1rem;
            display: none;
        }

        .preview.show {
            display: block;
        }

        .preview img {
            width: 100%;
            display: block;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }

        button:hover:not(:disabled) {
            background: #fff;
            color: #000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 2rem;
            border: 1px solid #000;
            padding: 2rem;
            display: none;
        }

        .result.show {
            display: block;
        }

        .suggestion {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .suggestion:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .suggestion h3 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .suggestion p {
            font-size: 0.875rem;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.25rem;
                margin-bottom: 1.5rem;
            }

            .upload-zone {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hairstyle Suggester</h1>

        <div class="upload-zone" id="uploadZone">
            <p>Click to upload, or drag and drop</p>
            <p style="margin-top: 0.5rem; opacity: 0.6;">PNG, JPG or GIF</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="preview" class="preview">
            <img id="previewImg" alt="Preview">
            <button id="suggestBtn">Get Hairstyle Suggestions</button>
        </div>

        <div id="result" class="result">
            <div id="suggestions"></div>
        </div>

        <div class="demo-embed">
            <blockquote class="twitter-tweet" data-theme="light">
                <p lang="en" dir="ltr">Hairstyle suggester demo <a
                        href="https://t.co/example">pic.twitter.com/example</a></p>&mdash; Hemanth HM (@GNUmanth) <a
                    href="https://twitter.com/GNUmanth/status/1846435140412801459">October 16, 2024</a>
            </blockquote>
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from 'https://esm.run/@google/generative-ai';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const suggestBtn = document.getElementById('suggestBtn');
        const result = document.getElementById('result');
        const suggestions = document.getElementById('suggestions');

        let selectedFile = null;

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.classList.add('show');
                result.classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        suggestBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const apiKey = prompt('Enter your Gemini API key:');
            if (!apiKey) return;

            suggestBtn.disabled = true;
            suggestBtn.textContent = 'Analyzing...';

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: 'gemini-2.0-flash-exp' });

                const imageData = await fileToBase64(selectedFile);

                const result_gen = await model.generateContent([
                    {
                        inlineData: {
                            mimeType: selectedFile.type,
                            data: imageData.split(',')[1]
                        }
                    },
                    'Analyze this face and suggest 3 hairstyle recommendations that would suit their face shape, features, and style. For each suggestion, provide the hairstyle name and a brief description of why it would work well.'
                ]);

                const text = result_gen.response.text();
                displaySuggestions(text);
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                suggestBtn.disabled = false;
                suggestBtn.textContent = 'Get Hairstyle Suggestions';
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function displaySuggestions(text) {
            suggestions.innerHTML = text.split('\n\n').map(s => {
                const lines = s.trim().split('\n');
                if (lines.length < 2) return '';
                return `<div class="suggestion">
                    <h3>${lines[0].replace(/^[\d.]+\s*/, '').replace(/\*\*/g, '')}</h3>
                    <p>${lines.slice(1).join(' ').replace(/\*\*/g, '')}</p>
                </div>`;
            }).filter(Boolean).join('');
            result.classList.add('show');
        }
    </script>
</body>

</html>
